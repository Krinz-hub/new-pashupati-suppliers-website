<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <ellipse cx="300" cy="380" rx="220" ry="25" fill="#CBD5E1" opacity="0.4" filter="blur(10px)" />

  <!-- Central Product Container -->
  <g transform="translate(100, 50)" filter="url(#shadow)">
    <rect width="400" height="300" rx="16" fill="url(#cardGrad)" />
    
    <!-- Decorative Subtle Grid Gridlines -->
    <line x1="0" y1="75" x2="400" y2="75" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4,4" />
    <line x1="0" y1="150" x2="400" y2="150" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4,4" />
    <line x1="0" y1="225" x2="400" y2="225" stroke="#FFFFFF" stroke-opacity="0.08" stroke-dasharray="4,4" />

    <!-- Badge -->
    <rect x="24" y="24" width="100" height="24" rx="12" fill="#F23822" />
    <text x="74" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">CLEANING</text>

    <!-- Product Symbol -->
    <circle cx="200" cy="135" r="45" fill="#FFFFFF" fill-opacity="0.1" />
    <polygon points="200,105 225,150 175,150" fill="#F23822" opacity="0.9" />

    <!-- Text Header -->
    <text x="200" y="220" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dustpan and Soft Bristle Hand Brush Set</text>
    <text x="200" y="245" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">NEW PASHUPATI SUPPLIERS</text>
  </g>
</svg>